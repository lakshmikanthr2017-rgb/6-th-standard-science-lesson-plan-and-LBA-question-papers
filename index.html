            html += `
                    </ol>
                </div>

                <div class="question-section">
                    <h4>ಭಾಗ - ಬ: ಎರಡು ಅಂಕಗಳ ಪ್ರಶ್ನೆಗಳು [2 × 2 = 4 ಅಂಕಗಳು] (ಲಿಖಿತ)</h4>
                    <ol>
            `;
            currentSet.twoMarks.forEach((q) => {
                html += `<li class="question-item">${q}
                    <div style="height: 18px; border-bottom: 1px dotted #bbb; margin-top: 1px;"></div>
                </li>`;
            });

            html += `
                    </ol>
                </div>

                <div class="question-section">
                    <h4>ಭಾಗ - ಕ: ನಾಲ್ಕು ಅಂಕಗಳ ಪ್ರಶ್ನೆಗಳು [2 × 4 = 8 ಅಂಕಗಳು] (ಲಿಖಿತ)</h4>
                    <ol>
            `;
            currentSet.fourMarks.forEach((q) => {
                html += `<li class="question-item">${q}
                    <div style="height: 35px; border-bottom: 1px dotted #bbb; margin-top: 1px;"></div>
                </li>`;
            });

            html += `
                    </ol>
                </div>

                <div class="question-section">
                    <h4>ಭಾಗ - ಡ: ಮೌಖಿಕ ಪ್ರಶ್ನೆಗಳು [5 ಅಂಕಗಳು] (Oral Assessment)</h4>
                    <ol>
            `;
            currentSet.oral.forEach((q) => {
                html += `<li class="question-item">${q}</li>`;
            });

            html += `
                    </ol>
                </div>
            `;

            document.getElementById('questionPaperContent').innerHTML = html;
            switchPage('page-question-paper');
        }

        function goToAnswers() {
            const lessonKey = document.getElementById('lessonSelect').value;
            const lesson = scienceData[lessonKey];

            let html = `
                <h3 style="color: var(--secondary-color); border-bottom: 2px solid #117a65; padding-bottom: 4px; font-size:15px;">ಮಾದರಿ ಉತ್ತರಗಳು (Answer Key) - ${lesson.name}</h3>
                
                <div class="question-section">
                    <h4>ಭಾಗ - ಅ: ಬಹುಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳ ಉತ್ತರಗಳು</h4>
                    <ol>
            `;
            lesson.sets.set1.mcqs.forEach((item, idx) => {
                html += `<li class="question-item">ಪ್ರಶ್ನೆ ${idx+1} ಉತ್ತರ: <strong>${item.ans}</strong></li>`;
            });

            html += `
                    </ol>
                </div>

                <div class="question-section">
                    <h4>ಭಾಗ - ಬ: ಎರಡು ಅಂಕಗಳ ಪ್ರಶ್ನೆಗಳ ಉತ್ತರಗಳು</h4>
                    <ol>
            `;
            lesson.answers.twoMarks.forEach((ans, idx) => {
                html += `<li class="question-item" style="margin-bottom: 5px;"><strong>ಉತ್ತರ ${idx+1}:</strong> ${ans}</li>`;
            });

            html += `
                    </ol>
                </div>

                <div class="question-section">
                    <h4>ಭಾಗ - ಕ: ನಾಲ್ಕು ಅಂಕಗಳ ಪ್ರಶ್ನೆಗಳ ಉತ್ತರಗಳು</h4>
                    <ol>
            `;
            lesson.answers.fourMarks.forEach((ans, idx) => {
                html += `<li class="question-item" style="margin-bottom: 6px;"><strong>ಉತ್ತರ ${idx+1}:</strong> ${ans}</li>`;
            });

            html += `
                    </ol>
                </div>

                <div class="question-section">
                    <h4>ಭಾಗ - ಡ: ಮೌಖಿಕ ಪ್ರಶ್ನೆಗಳ ಉತ್ತರಗಳು</h4>
                    <ol>
            `;
            lesson.answers.oral.forEach((ans, idx) => {
                html += `<li class="question-item"><strong>ಉತ್ತರ ${idx+1}:</strong> ${ans}</li>`;
            });

            html += `
                    </ol>
                </div>
            `;

            document.getElementById('answersContent').innerHTML = html;
            switchPage('page-answers');
        }

        function generateLessonPlan() {
            const school = document.getElementById('schoolNameInput').value.trim();
            const cluster = document.getElementById('clusterNameInput').value.trim();
            const taluk = document.getElementById('talukNameInput').value.trim();
            const teacher = document.getElementById('teacherNameInput').value.trim();
            const lessonKey = document.getElementById('lessonSelect').value;

            if (!school || !cluster || !taluk || !teacher || !lessonKey) {
                alert('ದಯವಿಟ್ಟು ಎಲ್ಲಾ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿರಿ.');
                return;
            }

            const lesson = scienceData[lessonKey];
            const lp = lesson.lessonPlan;

            let html = `
                <div style="text-align:center; margin-bottom: 6px;">
                    <h3 style="margin:2px; font-size:14px;">${school} (${cluster}, ${taluk})</h3>
                    <h4 style="margin:2px; font-size:13px;">5E ಕಲಿಕಾ ಮಾದರಿ ಪಾಠ ಯೋಜನೆ (5E Lesson Plan)</h4>
                    <p style="margin:2px; font-weight:bold; font-size:12px;">${lesson.name} &nbsp;|&nbsp; ಶಿಕ್ಷಕರು: ${teacher}</p>
                </div>
                <hr style="border: 0.5px solid #ccc; margin-bottom: 6px;">

                <div class="question-item" style="margin-bottom:6px;"><span class="step-title">1. ತೊಡಗಿಸಿಕೊಳ್ಳುವುದು (Engage):</span> ${lp.engage}</div>
                <div class="question-item" style="margin-bottom:6px;"><span class="step-title">2. ಅನ್ವೇಷಿಸುವುದು (Explore):</span> ${lp.explore}</div>
                <div class="question-item" style="margin-bottom:6px;"><span class="step-title">3. ವಿವರಿಸುವುದು (Explain):</span> ${lp.explain}</div>
                <div class="question-item" style="margin-bottom:6px;"><span class="step-title">4. ವಿಸ್ತರಿಸುವುದು (Elaborate):</span> ${lp.elaborate}</div>
                <div class="question-item" style="margin-bottom:6px;"><span class="step-title">5. ಮೌಲ್ಯಮಾಪನ (Evaluate):</span> ${lp.evaluate}</div>
            `;

            document.getElementById('lessonPlanContent').innerHTML = html;
            switchPage('page-lesson-plan');
        }

        function resetApp() {
            document.getElementById('entryForm').reset();
            switchPage('page-entry');
        }
    </script>
